name: .NET Core (Sparkles)

on:
  push:
    branches: [ main, master, migrate/** ]
    paths:
      - 'Sparkles/**'
      - 'SparkleShare/**'
      - 'SparkleShare.Core.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/dotnet-core.yml'
  pull_request:
    paths:
      - 'Sparkles/**'
      - 'SparkleShare/**'
      - 'SparkleShare.Core.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/dotnet-core.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SparkleShare.Core.sln also lists Mac/Windows heads; do not restore or build
      # the full solution on Linux (requires macos/windows workloads).
      - name: Restore
        run: |
          dotnet restore Sparkles/Sparkles.csproj
          dotnet restore Sparkles/Git/Sparkles.Git.csproj
          dotnet restore Sparkles/Tests/Sparkles.Tests.csproj

      - name: Build (Sparkles + tests)
        run: |
          dotnet build Sparkles/Sparkles.csproj --configuration Release --no-restore
          dotnet build Sparkles/Git/Sparkles.Git.csproj --configuration Release --no-restore
          dotnet build Sparkles/Tests/Sparkles.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Sparkles/Tests/Sparkles.Tests.csproj --configuration Release --no-build --verbosity normal
