# Build SparkleShare for Windows (app + WiX MSI) on GitHub-hosted runners.
# Limited to the Windows migration branch until merged to master/develop.

name: Windows build

on:
  push:
    branches:
      - migrate/windows-net10
    paths:
      - 'Sparkles/**'
      - 'SparkleShare/Common/**'
      - 'SparkleShare/Windows/**'
      - 'scripts/build-windows.cmd'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches:
      - migrate/windows-net10
    paths:
      - 'Sparkles/**'
      - 'SparkleShare/Common/**'
      - 'SparkleShare/Windows/**'
      - 'scripts/build-windows.cmd'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build app, bundle Git, and create MSI
        run: scripts\build-windows.cmd installer

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: SparkleShare-Windows-msi-${{ github.sha }}
          path: dist/windows/setup/x64/Release/*.msi
          if-no-files-found: error

      - name: Upload portable app folder (without git_scm)
        uses: actions/upload-artifact@v4
        with:
          name: SparkleShare-Windows-app-${{ github.sha }}
          path: |
            SparkleShare/Windows/bin/Release/SparkleShare.exe
            SparkleShare/Windows/bin/Release/*.dll
            SparkleShare/Windows/bin/Release/Images/**
            SparkleShare/Windows/bin/Release/Presets/**
          if-no-files-found: error
