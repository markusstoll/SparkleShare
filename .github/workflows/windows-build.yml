# Build SparkleShare for Windows (app + WiX MSI) on GitHub-hosted runners.
# Limited to the Windows migration branch until merged to master/develop.

name: Windows build

on:
  push:
    branches:
      - migrate/windows-net10
    paths:
      - 'Sparkles/**'
      - 'SparkleShare/Common/**'
      - 'SparkleShare/Windows/**'
      - 'scripts/build-windows.cmd'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches:
      - migrate/windows-net10
    paths:
      - 'Sparkles/**'
      - 'SparkleShare/Common/**'
      - 'SparkleShare/Windows/**'
      - 'scripts/build-windows.cmd'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build app, bundle Git, and create MSI
        run: scripts\build-windows.cmd installer

      - name: Stage MSI for artifact upload
        id: msi
        shell: pwsh
        run: |
          $candidates = @(
            'dist/windows/setup/x64/Release',
            'SparkleShare/Windows/Installer/bin/x64/Release',
            'SparkleShare/Windows/Installer/bin/Release',
            'SparkleShare/Windows/build/setup/x64/Release'
          )
          $msi = $null
          foreach ($dir in $candidates) {
            if (-not (Test-Path $dir)) { continue }
            $found = Get-ChildItem -Path $dir -Recurse -Filter '*.msi' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\obj\\' }
            if ($found) { $msi = $found[0]; break }
          }
          if (-not $msi) {
            Write-Host 'MSI search (excluding obj):'
            Get-ChildItem -Recurse -Filter '*.msi' |
              Where-Object { $_.FullName -notmatch '\\obj\\' } |
              ForEach-Object { Write-Host $_.FullName }
            throw 'No MSI produced by the WiX build'
          }
          $dest = 'dist/windows/setup/x64/Release'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $staged = Join-Path $dest $msi.Name
          Copy-Item -LiteralPath $msi.FullName -Destination $staged -Force
          Write-Host "Staged $staged (from $($msi.FullName))"
          "path=$dest/*.msi" >> $env:GITHUB_OUTPUT

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: SparkleShare-Windows-msi-${{ github.sha }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

      - name: Upload published app (full publish folder, incl. git_scm)
        uses: actions/upload-artifact@v4
        with:
          name: SparkleShare-Windows-app-${{ github.sha }}
          path: SparkleShare/Windows/bin/Release/publish/
          if-no-files-found: error
